<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawful Expat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #333;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid #2a2a2a;
      transition: background 0.2s, transform 0.15s;
      text-align: left;
    }

    .link:hover {
      background: #252525;
      transform: scale(1.02);
    }

    .link.coming-soon {
      opacity: 0.55;
      pointer-events: none;
    }

    .link .thumb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid #333;
    }

    .link .text {
      flex: 1;
    }

    .link .subtitle {
      display: block;
      font-size: 0.8rem;
      font-weight: 400;
      color: #888;
      margin-top: 2px;
    }

    .support {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #222;
    }

    .support-title {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .support-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .support-links a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 14px;
      border: 1px solid #333;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .support-links a:hover {
      background: #1f1f1f;
    }

    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <img 
      src="https://pbs.twimg.com/profile_images/2001356845970014208/GMgh8kId.jpg" 
      alt="Lawful Expat" 
      class="avatar"
    >

    <h1>Lawful Expat</h1>
    <p class="bio">Resources & documentation</p>

    <div class="links">
      <a href="https://lawfulexpat.github.io/followthelaw" class="link">
        <div class="text">
          Law Enforcement
          <span class="subtitle">Report illegal aliens & criminals</span>
        </div>
      </a>

      <a href="https://lawfulexpat.github.io/RyanWiersma/" class="link">
        <img 
          src="https://yt3.googleusercontent.com/cz5CEf0D2r6UCJU6LsZeHmYRSVwq79S0W_EXLNQ8I1s2HTDD4yEwmqJtAFGc3OqsN2uLuht8GWU=s800-c-k-c0x00ffffff-no-rj" 
          alt="Ryan Wiersma" 
          class="thumb"
        >
        <div class="text">
          Ryan Wiersma — Soborno/Corrupción
          <span class="subtitle">Documentación</span>
        </div>
      </a>

      <a href="https://lawfulexpat.github.io/ShaeFinn/" class="link">
        <img 
          src="https://drive.google.com/thumbnail?id=1rPsPlObZ3d1BkJgB36Ip-3wdW3-g13xH&sz=w200" 
          alt="Shae Finn" 
          class="thumb"
        >
        <div class="text">
          Shae Finn — Cultivo de sustancias ilegales/Evasión fiscal
          <span class="subtitle">Documentación</span>
        </div>
      </a>
    </div>

    <div class="support">
      <div class="support-title">Support</div>
      <div class="support-links">
        <a href="https://venmo.com/u/StevenRamirez1998" target="_blank" rel="noopener">Venmo</a>
        <a href="https://buymeacoffee.com/lawfulexpat" target="_blank" rel="noopener">Buy Me a Coffee</a>
      </div>
    </div>

    <footer>lawfulexpat</footer>
  </div>
</body>
</html>
